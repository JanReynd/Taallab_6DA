/* ================== TEXT-TO-SPEECH ================== */
function tts(btn){
  try{
    if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent="▶ Laat voorlezen";return}
    const l=LES[curRoute];const vs=speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang));
    const v1=vs.find(v=>/BE/i.test(v.lang))||vs[0],v2=vs.find(v=>v!==v1)||v1;
    l.dialog.lines.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x[1]);u.lang=(v1&&v1.lang)||"nl-BE";const v=x[0]==="Elias"?v2:v1;if(v)u.voice=v;u.rate=.95;u.pitch=x[0]==="Elias"?.9:1.1;if(i===l.dialog.lines.length-1)u.onend=()=>{btn.textContent="▶ Laat voorlezen"};speechSynthesis.speak(u)});
    btn.textContent="■ Stop";
  }catch(e){btn.textContent="Voorlezen niet beschikbaar in deze browser"}
}

/* ================== PDF EXPORT ================== */
function exportPDF(){
  const d=new Date().toLocaleDateString("nl-BE",{day:"numeric",month:"long",year:"numeric"});
  let h=`<h1>Redactiekamer – mijn werk</h1><div class="meta"><b>Naam:</b> ${esc(S.name||"……………………")} &nbsp; <b>Klas:</b> ${esc(S.klas||"……")} &nbsp; <b>Datum:</b> ${d} &nbsp; <b>Voortgang:</b> ${totalPct()}%</div>`;
  h+=`<h2>Scorelijst</h2><table><tr><th>Desk</th><th>Oefening</th><th>Score</th></tr>`;
  DESKS.forEach(dk=>dk.lessons.flatMap(l=>l.ex).forEach(e=>{const r=S.res[e.id];h+=`<tr><td>${dk.name}</td><td>${e.n} ${e.title}</td><td>${scored(e)?(r?r.score+" / "+r.max:"niet gemaakt"):(isDone(e)?"open – ingevuld":"open – leeg")}</td></tr>`}));
  const t=totals();h+=`<tr><th colspan="2">Totaal oefeningen</th><th>${t.s} / ${t.m}</th></tr><tr><th colspan="2">Exit ticket</th><th>${S.exit&&S.exit.done?S.exit.score+" / "+EXIT.length:"niet gemaakt"}</th></tr></table>`;
  DESKS.forEach((dk,di)=>{h+=`<h2 class="pb">${dk.name} <span style="font-weight:400;font-size:11pt">(${dk.orig})</span></h2>`;
    dk.lessons.forEach(l=>{h+=`<h3>Les ${l.id.replace("-",".")} – ${l.title}</h3>`;l.ex.forEach(e=>{h+=printEx(e)})})});
  h+=`<h2 class="pb">Exit ticket</h2>`;
  EXIT.forEach((q,i)=>{const x=S.exit||{a:{}};const s=x.a[i];const ok=s===q.a;h+=`<div class="pi">${i+1}. ${q.q}<br>&nbsp;&nbsp;Mijn antwoord: <b>${s!=null?esc(q.o[s]):"—"}</b> ${x.done?(ok?'<span class="ok">✓</span>':'<span class="bad">✗ juist: '+esc(q.o[q.a])+'</span>'):""}</div>`});
  $("#printArea").innerHTML=h;
  setTimeout(()=>{try{window.print()}catch(e){alert("Afdrukken is hier niet beschikbaar. Open het bestand in Chrome, Edge of Firefox.")}},60);
}
function printEx(e){
  const a=S.ans[e.id]||{},r=S.res[e.id];
  let h=`<div class="pi"><b>${e.n} ${e.title}</b> ${scored(e)?(r?`– score ${r.score}/${r.max}`:"– niet gecontroleerd"):"– open opdracht"}</div>`;
  const mark=(ok)=>r?(ok?' <span class="ok">✓</span>':' <span class="bad">✗</span>'):"";
  if(e.type==="choice")e.items.forEach((it,i)=>{const s=a[i];const ok=s===it.a;h+=`<div class="pi">${e.layout==="row"?it.q:(i+1)}. ${e.layout==="row"?"":strip(it.q).replace("___","…")} → <b>${s!=null?esc(it.o[s]):"—"}</b>${mark(ok)}${r&&!ok?` <span class="bad">(juist: ${esc(it.o[it.a])})</span>`:""}</div>`});
  if(e.type==="gap")e.items.forEach((it,i)=>{const acc=[].concat(it.a);const ok=acc.some(x=>norm(x)===norm(a[i]));h+=`<div class="pi">${i+1}. ${strip(it.q).replace("___","…")} → <b>${esc(a[i]||"—")}</b>${mark(ok)}${r&&!ok?` <span class="bad">(juist: ${esc(acc[0])})</span>`:""}</div>`});
  if(e.type==="match")e.items.forEach((it,i)=>{const ok=a[i]===it.a;h+=`<div class="pi">${i+1}. ${strip(it.q)} → <b>${esc(a[i]||"—")}</b>${mark(ok)}${r&&!ok?` <span class="bad">(juist: ${esc(it.a)})</span>`:""}</div>`});
  if(e.type==="proof"){const toks=proofTokens(e);const mk=a.marks||{};const ks=Object.keys(mk);if(!ks.length)h+=`<div class="pi">Geen fouten aangeduid.</div>`;ks.forEach(ti=>{const tk=toks[ti];const ok=tk.err&&norm(mk[ti])===norm(tk.right);h+=`<div class="pi">${esc(tk.t)} → <b>${esc(mk[ti]||"—")}</b>${r?(tk.err?(ok?' <span class="ok">✓</span>':' <span class="bad">✗ juist: '+esc(tk.right)+'</span>'):' <span class="bad">(was correct)</span>'):""}</div>`});
    if(r){const miss=toks.filter((tk,ti)=>tk.err&&!(mk[ti]!=null&&norm(mk[ti])===norm(tk.right)));if(miss.length)h+=`<div class="pi bad">Gemist: ${miss.map(tk=>esc(tk.t)+" → "+esc(tk.right)).join("; ")}</div>`}}
  if(e.type==="open")e.fields.forEach((f,i)=>{h+=`<div class="pi">${strip(f.l)}</div><div class="otext">${esc(a[i]||"—")}</div>`});
  return h;
}
